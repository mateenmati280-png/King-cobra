<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent;}
body{background:linear-gradient(180deg,#0a0a0a 0%,#150028 50%,#0a0a0a 100%);color:#fff;padding:15px;padding-bottom:100px;min-height:100vh;}

/* HEADER */
.page-header{display:flex;align-items:center;gap:15px;background:linear-gradient(135deg,#280f50,#140528);padding:16px 20px;border-radius:22px;border:1.5px solid #FFD700;margin-bottom:22px;box-shadow:0 4px 25px rgba(255,215,0,0.3);position:relative;}
.back-btn{width:44px;height:44px;background:linear-gradient(135deg,#2a0a4a,#0f0520);border-radius:14px;display:flex;justify-content:center;align-items:center;color:#FFD700;font-size:18px;cursor:pointer;border:1.5px solid rgba(255,215,0,0.6);text-decoration:none;}
.page-title{font-size:15px;font-weight:900;color:#FFD700;letter-spacing:3px;text-shadow:0 0 15px rgba(255,215,0,0.7);}

/* TROPHY BANNER */
.trophy-banner{text-align:center;margin-bottom:22px;}
.trophy-crown{font-size:48px;display:block;margin-bottom:8px;}
.trophy-title{font-size:22px;font-weight:900;background:linear-gradient(135deg,#FFD700,#FFA500,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:5px;margin-bottom:6px;}
.trophy-sub{font-size:10px;color:#B026FF;letter-spacing:4px;font-weight:800;text-transform:uppercase;}

/* PODIUM (Top 3) */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:8px;margin-bottom:26px;padding:20px 0 0;}
.podium-item{flex:1;text-align:center;position:relative;}
.podium-avatar{width:70px;height:70px;border-radius:50%;margin:0 auto 8px;background-color:#0a0514;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:26px;color:#fff;position:relative;border:3px solid;}
.podium-1 .podium-avatar{border-color:#FFD700;box-shadow:0 0 30px rgba(255,215,0,0.7);width:80px;height:80px;font-size:30px;}
.podium-2 .podium-avatar{border-color:#C0C0C0;box-shadow:0 0 20px rgba(192,192,192,0.6);}
.podium-3 .podium-avatar{border-color:#CD7F32;box-shadow:0 0 20px rgba(205,127,50,0.6);}

.podium-medal{position:absolute;top:-6px;right:calc(50% - 45px);font-size:22px;z-index:5;}
.podium-2 .podium-medal{right:calc(50% - 40px);font-size:18px;}
.podium-3 .podium-medal{right:calc(50% - 40px);font-size:18px;}

.podium-name{font-size:11px;color:#fff;font-weight:800;margin-bottom:3px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;padding:0 3px;}
.podium-plan{font-size:8px;color:#FFD700;font-weight:700;letter-spacing:1px;margin-bottom:3px;text-transform:uppercase;}
.podium-amount{font-size:12px;font-weight:900;color:#00FF88;}
.podium-1 .podium-amount{font-size:14px;color:#FFD700;}

.podium-stand{border-radius:12px 12px 0 0;margin-top:8px;position:relative;overflow:hidden;}
.podium-1 .podium-stand{height:70px;background:linear-gradient(180deg,#FFD700,#FFA500,#B8860B);}
.podium-2 .podium-stand{height:50px;background:linear-gradient(180deg,#C0C0C0,#909090,#606060);}
.podium-3 .podium-stand{height:35px;background:linear-gradient(180deg,#CD7F32,#8B4513,#5D2E0C);}
.podium-rank{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:rgba(0,0,0,0.7);}
.podium-1 .podium-rank{font-size:32px;}

/* RANK LIST */
.rank-list-title{text-align:center;font-size:11px;color:#FFD700;letter-spacing:4px;font-weight:800;margin:20px 0 14px 0;display:flex;align-items:center;justify-content:center;gap:12px;text-transform:uppercase;}
.rank-list-title::before,.rank-list-title::after{content:'';height:1.5px;width:60px;background:linear-gradient(to right,transparent,#FFD700);}
.rank-list-title::after{transform:scaleX(-1);}

.rank-item{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(30,10,60,0.9),rgba(10,5,20,0.95));border:1.5px solid rgba(176,38,255,0.3);border-radius:16px;padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;}
.rank-item::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(180deg,#B026FF,#FFD700);}
.rank-number{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#2a0a4a,#0f0520);border:1.5px solid #B026FF;display:flex;justify-content:center;align-items:center;font-size:14px;font-weight:900;color:#B026FF;flex-shrink:0;}
.rank-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#B026FF,#8A2BE2);display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;color:#fff;flex-shrink:0;border:2px solid rgba(255,215,0,0.4);}
.rank-info{flex:1;min-width:0;}
.rank-info h4{font-size:13px;color:#fff;font-weight:800;margin-bottom:2px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;}
.rank-info p{font-size:10px;color:#FFD700;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;}
.rank-amount{font-size:14px;font-weight:900;color:#00FF88;white-space:nowrap;}

/* Empty */
.empty{text-align:center;padding:70px 20px;background:linear-gradient(160deg,rgba(40,20,70,0.5),rgba(15,5,35,0.8));border-radius:22px;border:1.5px dashed rgba(255,215,0,0.4);}
.empty i{font-size:60px;display:block;margin-bottom:18px;opacity:0.4;color:#FFD700;}
.empty h4{font-size:15px;color:#ccc;margin-bottom:8px;font-weight:700;}
.empty p{font-size:11px;color:#777;}

/* Loading */
.loading{text-align:center;padding:80px 20px;color:#FFD700;}
.loading i{font-size:50px;display:block;margin-bottom:18px;animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.loading p{font-size:12px;letter-spacing:2px;font-weight:700;}
</style>
</head>
<body><div class="page-header">

/* ============================================================
   CONVERT FAKE USERS TO LEADERBOARD FORMAT
   ============================================================ */
function getFakeUsersData(){
    var now = new Date().getTime();
    return fakeUsers.map(function(u, i){
        return {
            email: 'fake_' + i + '@kingcobra.pro',
            name: u.name,
            topPlan: u.plan,
            topAmount: u.amount,
            createdAt: now - (u.minsAgo * 60 * 1000),
            isFake: true
        };
    });
}

/* ============================================================
   🚫 BLOCKED SCREEN
   ============================================================ */
function showBlockedScreen(){
    document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#1a0000 0%,#0a0000 60%,#000 100%);z-index:9999999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;font-family:Poppins,sans-serif;"><div style="width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#FF1744,#8B0000);display:flex;justify-content:center;align-items:center;font-size:70px;color:#fff;margin-bottom:35px;box-shadow:0 0 80px rgba(255,23,68,0.9);"><i class="fas fa-ban"></i></div><h1 style="font-size:28px;font-weight:800;color:#FF1744;letter-spacing:3px;text-shadow:0 0 40px #FF1744;">ACCOUNT BLOCKED</h1><p style="font-size:13px;color:#aaa;margin-top:15px;">Aap ka account temporary block hai.</p></div>';
}

/* ============================================================
   RENDER PODIUM (Top 3)
   ============================================================ */
function renderPodium(){
    var wrap = document.getElementById('podiumWrap');
    if(!wrap) return;

    if(leaderboardData.length === 0){
        wrap.innerHTML = '';
        return;
    }

    var top1 = leaderboardData[0] || null;
    var top2 = leaderboardData[1] || null;
    var top3 = leaderboardData[2] || null;

    var html = '';

    if(top2) html += buildPodiumItem(top2, 2);
    else html += '<div class="podium-item" style="opacity:0;"></div>';

    if(top1) html += buildPodiumItem(top1, 1);

    if(top3) html += buildPodiumItem(top3, 3);
    else html += '<div class="podium-item" style="opacity:0;"></div>';

    wrap.innerHTML = html;
}

function buildPodiumItem(user, rank){
    var medal = rank === 1 ? '🥇' : (rank === 2 ? '🥈' : '🥉');
    var initial = (user.name || 'U').charAt(0).toUpperCase();

    var html = '<div class="podium-item podium-' + rank + '">';
    html += '<div style="position:relative;display:inline-block;">';
    html += '<div class="podium-avatar">' + initial + '</div>';
    html += '<span class="podium-medal">' + medal + '</span>';
    html += '</div>';
    html += '<div class="podium-name">' + (user.name || 'User') + '</div>';
    html += '<div class="podium-plan">' + (user.topPlan || 'Plan') + '</div>';
    html += '<div class="podium-amount">Rs. ' + (user.topAmount || 0).toLocaleString() + '</div>';
    html += '<div class="podium-stand"><div class="podium-rank">#' + rank + '</div></div>';
    html += '</div>';

    return html;
}

/* ============================================================
   RENDER RANK LIST (Rank 4+)
   ============================================================ */
function renderRankList(){
    var el = document.getElementById('rankList');
    if(!el) return;

    var others = leaderboardData.slice(3);

    if(others.length === 0){
        el.innerHTML = '<div class="empty"><i class="fas fa-trophy"></i><h4>Sirf 3 Top Investors Hain</h4><p>Abhi tak koi aur invest nahi kiya</p></div>';
        return;
    }

    var html = '';
    others.forEach(function(user, index){
        var rank = index + 4;
        var initial = (user.name || 'U').charAt(0).toUpperCase();

        html += '<div class="rank-item">';
        html += '<div class="rank-number">' + rank + '</div>';
        html += '<div class="rank-avatar">' + initial + '</div>';
        html += '<div class="rank-info">';
        html += '<h4>' + (user.name || 'User') + '</h4>';
        html += '<p>' + (user.topPlan || 'Plan') + '</p>';
        html += '</div>';
        html += '<div class="rank-amount">Rs. ' + (user.topAmount || 0).toLocaleString() + '</div>';
        html += '</div>';
    });

    el.innerHTML = html;
}

console.log("🐍 Leaderboard Part 1 Loaded — Smooth");/* ============================================================
   🔥 LOAD LEADERBOARD — Real + Fake Users
   ============================================================ */
window.addEventListener('load', function(){
    var cur = localStorage.getItem('kingcobra_current');
    if(!cur){ window.location.href = 'index.html'; return; }
    try{ currentUser = JSON.parse(cur); }catch(e){ window.location.href = 'index.html'; return; }
    if(!currentUser.email){ window.location.href = 'index.html'; return; }

    // Block check
    onSnapshot(doc(db, 'users', currentUser.email), function(snap){
        if(!snap.exists()) return;
        if(snap.data().blocked === true) showBlockedScreen();
    });

    // Load real requests
    onSnapshot(collection(db, 'requests'), function(snap){
        var allRequests = [];
        snap.forEach(function(d){
            var r = d.data();
            if(r.type === 'invest' && r.status === 'approved'){
                allRequests.push(r);
            }
        });

        // Group real users by email
        var realUsersMap = {};
        allRequests.forEach(function(r){
            var email = r.userEmail;
            if(!realUsersMap[email]){
                realUsersMap[email] = {
                    email: email,
                    name: r.userName || 'User',
                    topAmount: r.amount || 0,
                    topPlan: r.packageName || 'Package',
                    createdAt: new Date(r.createdAt || 0).getTime(),
                    isFake: false
                };
            } else {
                if((r.amount || 0) > realUsersMap[email].topAmount){
                    realUsersMap[email].topAmount = r.amount || 0;
                    realUsersMap[email].topPlan = r.packageName || 'Package';
                }
            }
        });

        // Get fake users
        var fakeUsersData = getFakeUsersData();

        // Merge real + fake
        var combined = Object.values(realUsersMap).concat(fakeUsersData);
        combined.sort(function(a,b){ return b.topAmount - a.topAmount; });

        leaderboardData = combined;

        renderPodium();
        renderRankList();
    }, function(err){
        // Firestore fail ho to sirf fake users
        var fakeUsersData = getFakeUsersData();
        fakeUsersData.sort(function(a,b){ return b.topAmount - a.topAmount; });
        leaderboardData = fakeUsersData;
        renderPodium();
        renderRankList();
        console.log('Firestore error, showing fake data only:', err);
    });
});
