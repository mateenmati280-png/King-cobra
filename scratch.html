function showToast(msg, type){
  var t = document.getElementById('toast');
  if(!t){ alert(msg); return; }
  t.className = 'toast';
  if(type) t.classList.add(type);
  t.innerText = msg;
  t.classList.add('show');
  if(window.tt) clearTimeout(window.tt);
  window.tt = setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function fmt(n){
  n = Number(n) || 0;
  return n.toLocaleString('en-US');
}

function animateValue(el, start, end, duration){
  if(!el) return;
  var startTime = null;
  var isCurrency = el.innerText.indexOf('Rs.') !== -1;
  duration = duration || 800;

  function step(timestamp){
    if(!startTime) startTime = timestamp;
    var progress = Math.min((timestamp - startTime) / duration, 1);
    var currentValue = Math.floor(progress * (end - start) + start);
    el.innerText = isCurrency ? 'Rs. ' + currentValue.toLocaleString() : currentValue.toLocaleString();
    if(progress < 1){
      window.requestAnimationFrame(step);
    } else {
      el.innerText = isCurrency ? 'Rs. ' + end.toLocaleString() : end.toLocaleString();
    }
  }
  window.requestAnimationFrame(step);
}

function showConfetti(){
  var colors = ['#FFD700','#FF1744','#B026FF','#00FF88','#00BFFF','#FF69B4','#FFA500'];
  for(var i = 0; i < 60; i++){
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.6 + 's';
    c.style.animationDuration = (2 + Math.random() * 1) + 's';
    document.body.appendChild(c);
    setTimeout(function(el){ return function(){ el.remove(); }; }(c), 4000);
  }
}

    s.style.left = (rect.left + Math.random() * rect.width) + 'px';
    s.style.top = (rect.top + Math.random() * rect.height) + 'px';
    s.style.setProperty('--tx', (Math.random() * 80 - 40) + 'px');
    document.body.appendChild(s);
    setTimeout(function(el){ return function(){ el.remove(); }; }(s), 2000);
  }
}

function formatTimeRemaining(expiresAt){
  try{
    var now = new Date();
    var exp = new Date(expiresAt);
    var diff = exp - now;
    if(diff <= 0) return null;
    var hours = Math.floor(diff / (1000 * 60 * 60));
    var mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    var secs = Math.floor((diff % (1000 * 60)) / 1000);
    if(hours > 0) return hours + 'h ' + mins + 'm';
    if(mins > 0) return mins + 'm ' + secs + 's';
    return secs + 's';
  }catch(e){ return null; }
}

function getRandomReward(planNum){
  var range = PLAN_REWARDS[planNum];
  if(!range) return 5;
  return Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;

// 🔥 SCRATCH FIX (Touch & Mouse Working - No Hanging)
function initCanvasScratch(isCooldown){
  var canvas = document.getElementById('scratchCanvas');
  var container = document.getElementById('cardContainer');
  if(!canvas || !container) return;

  var rect = container.getBoundingClientRect();
  var width = Math.floor(rect.width);
  var height = Math.floor(rect.height);

  if(width === 0 || height === 0){
    setTimeout(function(){ initCanvasScratch(isCooldown); }, 200);
    return;
  }

  canvas.width = width;
  canvas.height = height;
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.globalCompositeOperation = 'source-over';

  var grad = ctx.createLinearGradient(0, 0, width, height);
  grad.addColorStop(0, '#C0C0C0');
  grad.addColorStop(0.25, '#E8E8E8');
  grad.addColorStop(0.5, '#909090');
  grad.addColorStop(0.75, '#D0D0D0');
  grad.addColorStop(1, '#A0A0A0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, height);

  for(var i = 0; i < 3000; i++){
    var x = Math.random() * width;
    var y = Math.random() * height;
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.08)';
    ctx.fillRect(x, y, 2, 2);
  }

  ctx.fillStyle = 'rgba(255,215,0,0.85)';
  ctx.font = 'bold 60px Poppins, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🪙', width / 2, height / 2 - 55);

  ctx.fillStyle = 'rgba(30,30,30,0.9)';
  ctx.font = 'bold 28px Poppins, sans-serif';
  ctx.fillText('SCRATCH & WIN', width / 2, height / 2 + 5);

  ctx.fillStyle = 'rgba(60,60,60,0.9)';
  ctx.font = 'bold 14px Poppins, sans-serif';
  ctx.fillText('FINGER SLIDE TO REVEAL', width / 2, height / 2 + 45);

  ctx.globalCompositeOperation = 'destination-out';

  var isDrawing = false;
  var lastX = null;
  var lastY = null;
  var revealed = false;

  if(isCooldown){
    return;
  }

  function getPos(e){
    var r = canvas.getBoundingClientRect();
    var clientX, clientY;

    if(e.touches && e.touches.length > 0){
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else if(e.changedTouches && e.changedTouches.length > 0){
      clientX = e.changedTouches[0].clientX;
      clientY = e.changedTouches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }

    var scaleX = canvas.width / r.width;
    var scaleY = canvas.height / r.height;

    return {
      x: (clientX - r.left) * scaleX,
      y: (clientY - r.top) * scaleY
    };
  }

  function drawDot(x, y, size){
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawLine(x1, y1, x2, y2, size){
    var dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));
    var steps = Math.max(1, Math.ceil(dist / 3));
    for(var i = 0; i <= steps; i++){
      var t = i / steps;
      var x = x1 + (x2 - x1) * t;
      var y = y1 + (y2 - y1) * t;
      drawDot(x, y, size);
    }
  }

  function checkScratchPercentage(){
    if(revealed) return;
    try{
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var pixels = imageData.data;
      var transparent = 0;
      var totalSampled = 0;

      for(var i = 3; i < pixels.length; i += 160){
        totalSampled++;
        if(pixels[i] === 0) transparent++;
      }

      var pct = (transparent / totalSampled) * 100;
      if(pct >= 45){
        revealCard();
      }
    }catch(e){
      console.log('Check error:', e);
    }
  }

  function startDraw(e){
    if(revealed) return;
    e.preventDefault();
    isDrawing = true;
    var pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    drawDot(pos.x, pos.y, Math.max(30, canvas.width * 0.08));
  }

  function moveDraw(e){
    if(!isDrawing || revealed) return;
    e.preventDefault();
    var pos = getPos(e);
    var brushSize = Math.max(30, canvas.width * 0.08);

    if(lastX !== null && lastY !== null){
      drawLine(lastX, lastY, pos.x, pos.y, brushSize);
    } else {
      drawDot(pos.x, pos.y, brushSize);
    }
    lastX = pos.x;
    lastY = pos.y;

    checkScratchPercentage();
  }

  function endDraw(e){
    if(revealed) return;
    isDrawing = false;
    lastX = null;
    lastY = null;
    checkScratchPercentage();
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, {passive: false});
  canvas.addEventListener('touchmove', moveDraw, {passive: false});
  canvas.addEventListener('touchend', endDraw, {passive: false});
  canvas.addEventListener('touchcancel', endDraw, {passive: false});
}

function revealCard(){
  var container = document.getElementById('cardContainer');
  if(!container) return;
  if(container.classList.contains('revealed')) return;

  container.classList.add('revealed');
  showSparkles(container);

  setTimeout(function(){
    claimScratchReward();
  }, 500);
}

async function claimScratchReward(){
  if(!selectedPlan || !currentReward) return;
  if(!currentUser || !userDocId) return;

  try{
    var now = new Date();
    var expiry = new Date(now.getTime() + (COOLDOWN_HOURS * 60 * 60 * 1000));
    var key = selectedPlan.id + '_scratch';

    var newScratchData = Object.assign({}, userScratchData);
    newScratchData[key] = expiry.toISOString();

    var currentBal = Number(userData.balance) || 0;
    var newBal = currentBal + currentReward;

    await updateDoc(doc(db, 'users', userDocId), {
      balance: newBal,
      scratchData: newScratchData,
      lastScratchAt: now.toISOString()
    });

    try{
      await addDoc(collection(db, 'scratchHistory'), {
        userEmail: currentUser.email,
        userDocId: userDocId,
        investmentId: selectedPlan.id,
        planName: selectedPlan.planName,
        amount: currentReward,
        createdAt: now.toISOString()
      });
    }catch(e){}

    try{
      await addDoc(collection(db, 'notifications'), {
        userEmail: currentUser.email,
        type: 'scratch_win',
        title: 'Scratch Reward!',
        message: 'You won Rs.' + fmt(currentReward) + ' from ' + selectedPlan.planName + ' Scratch Card!',
        amount: currentReward,
        createdAt: now.toISOString(),
        read: false
      });
    }catch(e){}

    userData.balance = newBal;
    userData.scratchData = newScratchData;
    userScratchData = newScratchData;
    totalWon += currentReward;

    if(currentUser){
      currentUser.balance = newBal;
      currentUser.scratchData = newScratchData;
      localStorage.setItem('kingcobra_current', JSON.stringify(currentUser));
    }

    animateValue(document.getElementById('statWon'), 0, totalWon, 800);
    document.getElementById('statStatus').innerText = 'LOCKED';

    document.getElementById('winAmount').innerText = 'Rs. ' + fmt(currentReward);
    document.getElementById('winPlanName').innerText = selectedPlan.planName + ' • PLAN #' + (PLAN_NUMBERS[selectedPlan.planName] || '00');
    document.getElementById('winModal').classList.add('show');
    showConfetti();
    showToast('🎉 Rs.' + fmt(currentReward) + ' added to balance!', 'success');

    setTimeout(function(){
      renderScratchCard();
    }, 2000);

  }catch(err){
    console.error('Claim error:', err);
    showToast('❌ Failed to claim reward', 'error');
  }
}

window.closeWinModal = function(){
  document.getElementById('winModal').classList.remove('show');
  renderScratchCard();
};

function loadUserPlans(){
  var investQ = query(
    collection(db, 'investments'),
    where('userEmail', '==', currentUser.email)
  );

  onSnapshot(investQ, function(snap){
    userPlans = [];
    snap.forEach(function(d){
      var inv = d.data();
      inv.id = d.id;

      if(inv.status === 'active' || inv.status === 'completed' || !inv.status){
        userPlans.push(inv);
      }
    });

    renderScratchCard();
  }, function(err){
    console.log('Plans load error:', err);
  });
}

function loadScratchHistory(){
  var q = query(
    collection(db, 'scratchHistory'),
    where('userEmail', '==', currentUser.email)
  );

  onSnapshot(q, function(snap){
    var total = 0;
    snap.forEach(function(d){
      total += Number(d.data().amount) || 0;
    });
    totalWon = total;
    animateValue(document.getElementById('statWon'), 0, totalWon, 1000);
  }, function(err){
    console.log('History error:', err);
  });
}

function startCooldownTimer(){
  setInterval(function(){
    var timerEl = document.getElementById('cooldownTimer');
    if(!timerEl || !selectedPlan) return;

    var key = selectedPlan.id + '_scratch';
    var expiry = userScratchData[key];
    if(!expiry) return;

    var timeLeft = formatTimeRemaining(expiry);
    if(timeLeft){
      timerEl.innerText = timeLeft;
    } else {
      renderScratchCard();
    }
  }, 1000);
}

async function findUserDocument(email){
  var cleanEmail = (email || '').toLowerCase().trim();
  if(!cleanEmail) throw new Error('Email empty');

  try{
    var q = query(collection(db, 'users'), where('email', '==', cleanEmail));
    var snap1 = await getDocs(q);
    if(!snap1.empty){
      var d1 = snap1.docs[0];
      return { id: d1.id, data: d1.data() };
    }
  }catch(e){}

  try{
    var allSnap = await getDocs(collection(db, 'users'));
    var found = null;
    allSnap.forEach(function(d){
      var u = d.data();
      if(u.email && u.email.toLowerCase().trim() === cleanEmail){
        found = { id: d.id, data: u };
      }
    });
    if(found) return found;
  }catch(e){}

  throw new Error('User data nahi mila!');
}

  document.body.innerHTML = '<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(160deg,#1a0000 0%,#0a0000 60%,#000 100%);z-index:9999999;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;font-family:Poppins,sans-serif;">' +
    '<div style="width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#FF1744,#8B0000);display:flex;justify-content:center;align-items:center;font-size:70px;color:#fff;margin-bottom:35px;">' +
    '<i class="fas fa-ban"></i></div>' +
    '<h1 style="font-size:28px;font-weight:800;color:#FF1744;letter-spacing:3px;">ACCOUNT BLOCKED</h1>' +
    '</div>';
}

window.addEventListener('load', async function(){
  var cur = localStorage.getItem('kingcobra_current');
  if(!cur){ window.location.href = 'index.html'; return; }

  try{ currentUser = JSON.parse(cur); }catch(e){ window.location.href = 'index.html'; return; }
  if(!currentUser.email){ window.location.href = 'index.html'; return; }

  try{
    var result = await findUserDocument(currentUser.email);
    userDocId = result.id;
    userData = result.data;

    if(userData.scratchData){
      userScratchData = userData.scratchData;
    }

    onSnapshot(doc(db, 'users', userDocId), function(snap){
      if(!snap.exists()) return;
      var u = snap.data();
      userData = u;

      if(u.blocked === true){
        showBlockedScreen();
        return;
      }

      if(u.scratchData){
        userScratchData = u.scratchData;
      }

      currentUser = Object.assign({}, currentUser, u);
      localStorage.setItem('kingcobra_current', JSON.stringify(currentUser));
    });

    loadUserPlans();
    loadScratchHistory();
    startCooldownTimer();

  }catch(err){
    console.error('Init error:', err);
    showToast('Error: ' + err.message, 'error');

    document.getElementById('scratchWrapper').innerHTML = 
      '<div class="empty-state">' +
      '<div class="empty-icon" style="color:#FF1744;"><i class="fas fa-exclamation-triangle"></i></div>' +
      '<h3>USER DATA NAHI MILA</h3>' +
      '<p>' + err.message + '</p>' +
      '<a href="dashboard.html" class="cta-btn">GO TO DASHBOARD</a>' +
      '</div>';
  }
});
